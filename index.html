<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BakeFlow Cloud - Smart Bakery OS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#ea580c',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body x-data="bakeFlowCloud()" :class="darkMode ? 'dark bg-darkBg text-slate-100' : 'bg-slate-50 text-slate-800'" class="min-h-screen transition-colors duration-300">

    <!-- AUTHENTICATION MODAL (LOGIN / SIGNUP) -->
    <div x-show="!currentUser" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
        <div class="bg-white dark:bg-cardBg max-w-md w-full p-6 rounded-2xl shadow-2xl space-y-4">
            <div class="text-center">
                <div class="w-16 h-16 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto text-3xl mb-2">🧁</div>
                <h2 class="text-2xl font-bold" x-text="isSignUp ? 'Create Cloud Account' : 'Welcome Back'"></h2>
                <p class="text-sm text-slate-500">Access your bakery business from any device worldwide.</p>
            </div>

            <form @submit.prevent="handleAuth" class="space-y-4">
                <template x-if="isSignUp">
                    <div>
                        <label class="block text-sm font-medium mb-1">Bakery / Business Name</label>
                        <input type="text" x-model="authForm.shopName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:border-primary" placeholder="Sweet Delights Bakery">
                    </div>
                </template>
                <div>
                    <label class="block text-sm font-medium mb-1">Email Address</label>
                    <input type="email" x-model="authForm.email" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:border-primary" placeholder="owner@gmail.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" x-model="authForm.password" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:border-primary" placeholder="••••••••">
                </div>

                <div x-show="authError" class="text-rose-500 text-xs font-semibold text-center" x-text="authError"></div>

                <button type="submit" class="w-full py-3 bg-primary text-white font-medium rounded-xl shadow-lg shadow-primary/30 hover:bg-primary/90 transition" x-text="isLoading ? 'Connecting Cloud...' : (isSignUp ? 'Create Account' : 'Login to App')"></button>
            </form>

            <div class="text-center text-sm text-slate-500 pt-2">
                <span x-text="isSignUp ? 'Already have an account?' : 'New bakery owner?'"></span>
                <button @click="isSignUp = !isSignUp; authError=''" class="text-primary font-bold ml-1 underline" x-text="isSignUp ? 'Login here' : 'Register here'"></button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div x-show="currentUser">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white dark:bg-cardBg shadow-sm border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i data-lucide="menu" class="w-6 h-6 text-primary"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <template x-if="shopProfile.logo">
                        <img :src="shopProfile.logo" class="w-9 h-9 rounded-xl object-cover border border-primary">
                    </template>
                    <template x-if="!shopProfile.logo">
                        <div class="w-9 h-9 bg-primary/10 rounded-xl flex items-center justify-center text-primary font-bold text-lg">🍰</div>
                    </template>
                    <div>
                        <h1 class="font-bold text-base leading-tight" x-text="shopProfile.shopName || 'BakeFlow Cloud'"></h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400" x-text="currentUser ? currentUser.email : ''"></p>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button @click="toggleDarkMode()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i :data-lucide="darkMode ? 'sun' : 'moon'" class="w-5 h-5 text-amber-500"></i>
                </button>
                <button @click="logout()" title="Logout Account" class="p-2 rounded-lg hover:bg-rose-100 text-rose-500 transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <!-- Sidebar Drawer -->
        <div x-show="sidebarOpen" class="fixed inset-0 z-50 flex">
            <div @click="sidebarOpen = false" class="fixed inset-0 bg-black/50 transition-opacity"></div>
            <div class="relative w-72 bg-white dark:bg-cardBg h-full shadow-2xl flex flex-col z-10 p-5 space-y-6">
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-4">
                    <div class="flex items-center space-x-2">
                        <span class="text-2xl">☁️</span>
                        <span class="font-bold text-xl">Cloud Menu</span>
                    </div>
                    <button @click="sidebarOpen = false" class="p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>

                <nav class="space-y-2 flex-1 overflow-y-auto">
                    <button @click="currentTab = 'dashboard'; sidebarOpen = false" :class="currentTab === 'dashboard' ? 'bg-primary text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-800'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        <span>Dashboard</span>
                    </button>
                    <button @click="currentTab = 'orders'; sidebarOpen = false" :class="currentTab === 'orders' ? 'bg-primary text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-800'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition">
                        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                        <span>Orders & POS</span>
                    </button>
                    <button @click="currentTab = 'settings'; sidebarOpen = false" :class="currentTab === 'settings' ? 'bg-primary text-white' : 'hover:bg-slate-100 dark:hover:bg-slate-800'" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                        <span>Shop Branding</span>
                    </button>
                </nav>

                <div class="border-t border-slate-200 dark:border-slate-700 pt-4 text-xs text-center text-slate-500">
                    BakeFlow Cloud Edition • Firebase Enabled
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto p-4 md:p-6 pb-24">

            <!-- DASHBOARD TAB -->
            <div x-show="currentTab === 'dashboard'" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="bg-white dark:bg-cardBg p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                        <span class="text-sm text-slate-500">Total Cloud Orders</span>
                        <h2 class="text-2xl font-bold mt-2" x-text="orders.length">0</h2>
                    </div>
                    <div class="bg-white dark:bg-cardBg p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                        <span class="text-sm text-slate-500">Total Sales</span>
                        <h2 class="text-2xl font-bold mt-2 text-emerald-500" x-text="'৳ ' + totalSales">0</h2>
                    </div>
                    <div class="bg-white dark:bg-cardBg p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                        <span class="text-sm text-slate-500">Due Balance</span>
                        <h2 class="text-2xl font-bold mt-2 text-rose-500" x-text="'৳ ' + totalDue">0</h2>
                    </div>
                </div>
            </div>

            <!-- ORDERS TAB -->
            <div x-show="currentTab === 'orders'" class="space-y-6">
                <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                    <h3 class="text-xl font-bold mb-4">Add New Order (Synced to Cloud)</h3>
                    <form @submit.prevent="addOrder" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="text" x-model="newOrder.customerName" placeholder="Customer Name" required class="px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        <input type="text" x-model="newOrder.phone" placeholder="WhatsApp Phone" required class="px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        <input type="text" x-model="newOrder.item" placeholder="Cake Flavor & Weight" required class="px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        <input type="number" x-model.number="newOrder.total" placeholder="Total Amount" required class="px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        <input type="number" x-model.number="newOrder.advance" placeholder="Advance Paid" required class="px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        <input type="date" x-model="newOrder.deliveryDate" required class="px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        
                        <div class="md:col-span-3 flex justify-end">
                            <button type="submit" class="px-6 py-3 bg-primary text-white font-medium rounded-xl shadow-lg shadow-primary/30 hover:bg-primary/90 transition flex items-center space-x-2">
                                <i data-lucide="cloud-upload" class="w-5 h-5"></i>
                                <span>Save Order & Send WhatsApp</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Orders Table -->
                <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                    <h3 class="text-xl font-bold mb-4">Cloud Synced Orders</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-200 dark:border-slate-700 text-slate-400 text-sm">
                                    <th class="py-3 px-4">Customer</th>
                                    <th class="py-3 px-4">Cake</th>
                                    <th class="py-3 px-4">Total</th>
                                    <th class="py-3 px-4">Paid/Due</th>
                                    <th class="py-3 px-4 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="order in orders" :key="order.id">
                                    <tr class="border-b border-slate-100 dark:border-slate-800">
                                        <td class="py-3 px-4 font-medium" x-text="order.customerName"></td>
                                        <td class="py-3 px-4" x-text="order.item"></td>
                                        <td class="py-3 px-4 font-bold" x-text="'৳ ' + order.total"></td>
                                        <td class="py-3 px-4">
                                            <span class="text-emerald-500" x-text="'Paid: ৳' + order.advance"></span><br>
                                            <span class="text-rose-500 text-xs" x-text="'Due: ৳' + (order.total - order.advance)"></span>
                                        </td>
                                        <td class="py-3 px-4 text-center space-x-2">
                                            <button @click="sendWhatsApp(order)" class="p-2 text-emerald-500 hover:bg-emerald-50 rounded-lg"><i data-lucide="message-circle" class="w-4 h-4"></i></button>
                                            <button @click="deleteOrder(order.id)" class="p-2 text-rose-500 hover:bg-rose-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- SHOP SETTINGS TAB -->
            <div x-show="currentTab === 'settings'" class="space-y-6">
                <div class="bg-white dark:bg-cardBg p-6 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-4">
                    <h3 class="text-xl font-bold">Cloud Shop Settings</h3>
                    <form @submit.prevent="updateShopProfile" class="space-y-4 max-w-lg">
                        <div>
                            <label class="block text-sm font-medium mb-1">Shop Name</label>
                            <input type="text" x-model="shopProfile.shopName" required class="w-full px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">WhatsApp Contact</label>
                            <input type="text" x-model="shopProfile.phone" required class="w-full px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Logo URL (or Base64)</label>
                            <input type="text" x-model="shopProfile.logo" placeholder="https://..." class="w-full px-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                        </div>
                        <button type="submit" class="px-5 py-2.5 bg-primary text-white font-medium rounded-xl">Save Settings to Cloud</button>
                    </form>
                </div>
            </div>

        </main>
    </div>

    <!-- APP FIREBASE & ALPINE LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDP9A4C78LP1VBJuVwdiotnzvWS_Lhnytk",
            authDomain: "bakeflow-fc939.firebaseapp.com",
            projectId: "bakeflow-fc939",
            storageBucket: "bakeflow-fc939.firebasestorage.app",
            messagingSenderId: "1034318320533",
            appId: "1:1034318320533:web:3a7704c242490886b69c9c",
            measurementId: "G-FDPX5SRGRP"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        document.addEventListener('alpine:init', () => {
            Alpine.data('bakeFlowCloud', () => ({
                currentTab: 'dashboard',
                sidebarOpen: false,
                darkMode: true,
                currentUser: null,
                isSignUp: false,
                isLoading: false,
                authError: '',

                authForm: { email: '', password: '', shopName: '' },
                shopProfile: { shopName: '', phone: '', logo: '' },
                orders: [],
                newOrder: { customerName: '', phone: '', item: '', total: '', advance: '', deliveryDate: '' },

                init() {
                    auth.onAuthStateChanged(user => {
                        if (user) {
                            this.currentUser = user;
                            this.fetchCloudData();
                        } else {
                            this.currentUser = null;
                        }
                        setTimeout(() => lucide.createIcons(), 100);
                    });
                },

                toggleDarkMode() { this.darkMode = !this.darkMode; },

                async handleAuth() {
                    this.isLoading = true;
                    this.authError = '';
                    try {
                        if (this.isSignUp) {
                            const res = await auth.createUserWithEmailAndPassword(this.authForm.email, this.authForm.password);
                            await db.collection('users').doc(res.user.uid).set({
                                shopName: this.authForm.shopName,
                                email: this.authForm.email,
                                phone: '',
                                logo: ''
                            });
                        } else {
                            await auth.signInWithEmailAndPassword(this.authForm.email, this.authForm.password);
                        }
                    } catch (err) {
                        this.authError = err.message;
                    } finally {
                        this.isLoading = false;
                    }
                },

                logout() {
                    auth.signOut();
                },

                fetchCloudData() {
                    if (!this.currentUser) return;

                    // Listen to Profile
                    db.collection('users').doc(this.currentUser.uid).onSnapshot(doc => {
                        if (doc.exists) this.shopProfile = doc.data();
                    });

                    // Listen to Orders in Realtime
                    db.collection('users').doc(this.currentUser.uid).collection('orders')
                      .orderBy('createdAt', 'desc')
                      .onSnapshot(snapshot => {
                          this.orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                          setTimeout(() => lucide.createIcons(), 50);
                      });
                },

                async addOrder() {
                    if (!this.currentUser) return;
                    const orderData = { ...this.newOrder, createdAt: new Date().toISOString() };
                    await db.collection('users').doc(this.currentUser.uid).collection('orders').add(orderData);
                    this.sendWhatsApp(this.newOrder);
                    this.newOrder = { customerName: '', phone: '', item: '', total: '', advance: '', deliveryDate: '' };
                    alert('Order synced to Firebase Cloud!');
                },

                async deleteOrder(id) {
                    if (confirm('Delete this order permanently from Cloud?')) {
                        await db.collection('users').doc(this.currentUser.uid).collection('orders').doc(id).delete();
                    }
                },

                async updateShopProfile() {
                    await db.collection('users').doc(this.currentUser.uid).update(this.shopProfile);
                    alert('Profile updated on Cloud!');
                },

                sendWhatsApp(order) {
                    const due = order.total - order.advance;
                    const msg = `Hello *${order.customerName}*,\n\nThank you for ordering from *${this.shopProfile.shopName}*! 🎂\n\n*Order Details:*\n- Item: ${order.item}\n- Total: ৳${order.total}\n- Paid: ৳${order.advance}\n- Due: ৳${due}\n- Delivery: ${order.deliveryDate}`;
                    window.open(`https://wa.me/88${order.phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
                },

                get totalSales() { return this.orders.reduce((sum, o) => sum + Number(o.total), 0); },
                get totalDue() { return this.orders.reduce((sum, o) => sum + (Number(o.total) - Number(o.advance)), 0); }
            }));
        });
    </script>
</body>
</html>
